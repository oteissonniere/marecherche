name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The app icon is an Icon Composer file (App/AppIcon.icon), which needs Xcode 26 or
    # later; older Xcode versions look for an AppIcon asset catalog and fail.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show toolchain versions
        run: xcodebuild -version && node --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Tests, regex check and unsigned builds
        run: ./scripts/ci.sh
