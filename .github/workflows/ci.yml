name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA (a tag can be moved); Dependabot keeps the
# pins up to date through pull requests (.github/dependabot.yml).
jobs:
  build:
    # The app icon is an Icon Composer file (App/AppIcon.icon), which needs Xcode 26 or
    # later; older Xcode versions look for an AppIcon asset catalog and fail.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Show toolchain versions
        run: xcodebuild -version && node --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Tests, regex check and unsigned builds
        run: ./scripts/ci.sh
