# Dependabot keeps the pinned GitHub Actions and any future npm dependency up to date.
# The extension has no npm dependencies today; watching webext/ covers future ones.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /webext
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
